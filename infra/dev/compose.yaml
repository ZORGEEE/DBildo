name: dbildo-dev

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
    AIRFLOW__API_AUTH__JWT_SECRET: dbildo-local-dev-jwt-secret-change-for-real-deployment
    AIRFLOW__API__BASE_URL: http://localhost:8080
    PYTHONPATH: /opt/airflow/dags
    DBILDO_SOURCE_PG_URL: postgresql://dbildo:dbildo@source-postgres:5432/source
    DBILDO_CLICKHOUSE_HOST: clickhouse
    DBILDO_CLICKHOUSE_USER: dbildo
    DBILDO_CLICKHOUSE_PASSWORD: dbildo
  volumes:
    - ../../runtime/airflow/dags:/opt/airflow/dags:ro
    - airflow-logs:/opt/airflow/logs
  depends_on:
    airflow-postgres:
      condition: service_healthy

services:
  source-postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: dbildo
      POSTGRES_PASSWORD: dbildo
      POSTGRES_DB: source
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-source-data:/var/lib/postgresql/data
      - ./source.sql:/docker-entrypoint-initdb.d/01-source.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbildo -d source"]
      interval: 5s
      retries: 12

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_USER: dbildo
      CLICKHOUSE_PASSWORD: dbildo
      CLICKHOUSE_DB: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse.sql:/docker-entrypoint-initdb.d/01-clickhouse.sql:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "dbildo", "--password", "dbildo", "--query", "SELECT 1"]
      interval: 5s
      retries: 12

  airflow-postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pg-airflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      retries: 12

  airflow-init:
    <<: *airflow-common
    command: db migrate
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      source-postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      source-postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  pg-source-data:
  pg-airflow-data:
  clickhouse-data:
  airflow-logs:
